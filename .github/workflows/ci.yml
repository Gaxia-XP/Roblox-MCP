name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: server tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x, 24.x]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The server has no runtime deps needed for the tests themselves
      # (helpers are pure; http-bridge tests spawn server.mjs, which imports
      # @modelcontextprotocol/sdk — so install is required for the child to boot).
      - name: Install dependencies
        run: npm ci || npm install

      - name: Run tests
        run: npm test
